[package]
name = "kisp"
version = "0.1.0"
edition = "2021"
default-run = "repl"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kisp"
path = "src/lib.rs"
test = true

[features]
default = ["repl"]
functional = []
# the REPL needs a terminal library that does not build on wasm32; the library itself is dependency free
repl = ["dep:linefeed"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["repl"]

[dependencies]
linefeed = { version = "0.6", optional = true }